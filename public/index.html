<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALLE DEL CIELO - Cricket Auction</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; margin: 20px auto; max-width: 500px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, select, button { padding: 12px; margin: 10px 0; width: 85%; border-radius: 5px; border: none; font-size: 16px; box-sizing: border-box; }
        button { background: #3b82f6; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        #auctionArea, #bidControls, #adminControls { display: none; }
        .player-img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 3px solid #38bdf8; }
    </style>
</head>
<body>

    <h1>VALLE DEL CIELO - Live Cricket Auction</h1>

    <div class="card" id="loginCard">
        <h3>Join Auction Room</h3>
        <input type="text" id="teamNameInput" placeholder="Enter Team Name (e.g. MI, KKR)">
        <br>
        <button onclick="joinAuction()">Enter as Franchise</button>
        <hr style="border: 0.5px solid #334155; margin: 15px 0;">
        <h3>Admin Panel Login</h3>
        <input type="password" id="adminPassInput" placeholder="Enter Admin Password">
        <br>
        <button style="background: #ef4444;" onclick="loginAdmin()">Login as Admin</button>
    </div>

    <div class="card" id="auctionArea">
        <h2 id="roleTitle" style="color: #38bdf8; margin-top: 5px;">Welcome</h2>
        <div id="playerBox" style="background: #334155; padding: 15px; border-radius: 8px; margin-top: 15px;">
            <img id="playerPhoto" src="" class="player-img" style="display:none;" alt="Player">
            <h3 id="playerName">Waiting for Auction to Start...</h3>
            <p id="playerRole" style="color: #94a3b8;"></p>
            <p>Base Price: <span id="playerBase">0</span> CR</p>
            <h2 style="color: #4ade80; margin: 10px 0;">Current Bid: <span id="currentBid">0</span> CR</h2>
            <p>Leading Team: <strong id="leadingTeam" style="color: #facc15;">None</strong></p>
        </div>

        <!-- Team Bid Button -->
        <div id="bidControls">
            <button style="background: #22c55e; font-size: 18px; margin-top: 15px;" onclick="placeBid()">PLACE BID 🚀</button>
        </div>

        <!-- Admin Control Buttons -->
        <div id="adminControls" style="margin-top: 20px; border-top: 1px solid #475569; padding-top: 15px;">
            <h3>Admin Controls</h3>
            <button style="background: #10b981;" onclick="startAuction()">Start / Resume Auction</button>
            <button style="background: #6366f1;" onclick="nextPlayer()">Next Player ➡️</button>
            <button style="background: #f59e0b;" onclick="stopAuction()">Pause Auction</button>
        </div>
    </div>

    <script>
        const socket = io();
        let myTeam = "";
        let isAdmin = false;

        function joinAuction() {
            myTeam = document.getElementById('teamNameInput').value.trim();
            if(!myTeam) { alert("Please enter team name!"); return; }
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('auctionArea').style.display = 'block';
            document.getElementById('roleTitle').innerText = "Franchise: " + myTeam;
            document.getElementById('bidControls').style.display = 'block';
        }

        function loginAdmin() {
            const password = document.getElementById('adminPassInput').value;
            socket.emit('loginAdmin', { password }, (response) => {
                if(response.success) {
                    isAdmin = true;
                    document.getElementById('loginCard').style.display = 'none';
                    document.getElementById('auctionArea').style.display = 'block';
                    document.getElementById('roleTitle').innerText = "Admin Control Room (Auctioneer)";
                    document.getElementById('adminControls').style.display = 'block';
                } else {
                    alert(response.message);
                }
            });
        }

        function placeBid() {
            if(!myTeam) return alert("Join with a team name first!");
            socket.emit('placeBid', { teamName: myTeam });
        }

        function startAuction() { socket.emit('startAuction'); }
        function stopAuction() { socket.emit('stopAuction'); }
        function nextPlayer() { socket.emit('nextPlayer'); }

        socket.on('syncState', (data) => {
            updateUI(data.auctionState);
        });

        socket.on('bidUpdated', (auctionState) => {
            updateUI(auctionState);
        });

        socket.on('auctionStarted', (auctionState) => {
            updateUI(auctionState);
        });

        function updateUI(auctionState) {
            if(auctionState && auctionState.currentPlayer) {
                document.getElementById('playerName').innerText = auctionState.currentPlayer.name;
                document.getElementById('playerRole').innerText = "Role: " + auctionState.currentPlayer.role;
                document.getElementById('playerBase').innerText = auctionState.currentPlayer.basePrice;
                document.getElementById('currentBid').innerText = auctionState.currentBid || auctionState.currentPlayer.basePrice;
                document.getElementById('leadingTeam').innerText = auctionState.leadingTeam || "None";
                
                let img = document.getElementById('playerPhoto');
                if(auctionState.currentPlayer.photo) {
                    img.src = auctionState.currentPlayer.photo;
                    img.style.display = 'inline-block';
                } else {
                    img.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
