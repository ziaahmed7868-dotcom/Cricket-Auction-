<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valle Del Cielo - Cricket Auction</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --green: #22c55e; --red: #ef4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg); color: #fff; min-height: 100vh; }
        .screen { display: none; padding: 15px; max-width: 600px; margin: 0 auto; }
        .screen.active { display: block; }

        /* Welcome Screen */
        .box { background: var(--card); padding: 20px; border-radius: 12px; margin-top: 30px; text-align: center; }
        select, button, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1rem; }
        button { background: var(--accent); color: #000; font-weight: bold; border: none; cursor: pointer; }

        /* Auction Screen */
        .player-card { background: var(--card); padding: 15px; border-radius: 12px; text-align: center; position: relative; }
        .player-img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; margin: 10px 0; border: 3px solid var(--accent); }
        
        /* Dynamic Dual Timer */
        .timer-box { position: relative; width: 100px; height: 100px; margin: 0 auto; }
        .timer-svg { transform: rotate(-90deg); width: 100%; height: 100%; }
        circle { fill: none; stroke-width: 8; }
        .bg-circle { stroke: #334155; }
        .arc-circle { stroke: var(--red); stroke-dasharray: 283; stroke-dashoffset: 0; transition: 1s linear; }
        .big-countdown { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.2rem; font-weight: bold; color: var(--red); }

        .bid-btn { background: var(--green); color: #000; font-size: 1.4rem; padding: 18px; font-weight: bold; margin-top: 15px; border-radius: 10px; }
        .bid-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        /* Overlay Sold/Unsold */
        .overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.95); z-index: 100; align-items: center; justify-content: center; text-align: center; }
        .overlay.active { display: flex; }
        .stamp { font-size: 3.5rem; font-weight: bold; margin-bottom: 10px; }
        .sold { color: var(--green); }
        .unsold { color: var(--red); }

        /* Chat / Voice Bar */
        .chat-bar { margin-top: 15px; background: var(--card); padding: 10px; border-radius: 8px; }
        .chat-msg { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 4px; text-align: left; }
    </style>
</head>
<body>

    <!-- SCREEN 1: LOGIN & RETENTION -->
    <div id="screen-login" class="screen active">
        <div class="box">
            <h2>VALLE DEL CIELO AUCTION</h2>
            
            <!-- Dynamic Team Dropdown loaded from Google Sheet 'Teams' tab -->
            <select id="team-select" onchange="checkFormEligibility()">
                <option value="">-- Select Your Team --</option>
            </select>

            <!-- Admin Checkbox & Password Protection -->
            <div style="margin: 15px 0; text-align: left; background: #0f172a; padding: 10px; border-radius: 6px;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="admin-checkbox" onchange="toggleAdminPassword()" style="width: auto;">
                    <span>Login as Admin / Auctioneer</span>
                </label>
                <div id="admin-password-box" style="display: none; margin-top: 10px;">
                    <input type="password" id="admin-password-input" placeholder="Enter Admin Password">
                </div>
            </div>

            <button id="btn-retention-toggle" onclick="toggleRetentionBox()" style="display:none; background:#eab308; color:#000;">PLAYER RETENTION</button>

            <div id="retention-box" style="display:none; margin-top:10px;">
                <select id="retention-player-select"></select>
                <input type="number" id="retention-price-input" placeholder="Retention Price (in CR)" value="15.0" step="0.5">
                <button onclick="applyRetention()" style="background:var(--green); color:#000;">Confirm Retention</button>
            </div>

            <button id="btn-enter-auction" onclick="enterAuction()" disabled style="margin-top:20px;">ENTER AUCTION</button>
        </div>
    </div>

    <!-- SCREEN 2: LIVE AUCTION -->
    <div id="screen-dashboard" class="screen">
        <div class="player-card">
            <!-- 20s Dynamic Pie + 3s Big Font -->
            <div class="timer-box">
                <svg class="timer-svg">
                    <circle class="bg-circle" cx="50" cy="50" r="45"></circle>
                    <circle id="timer-arc" class="arc-circle" cx="50" cy="50" r="45"></circle>
                </svg>
                <div id="timer-text" class="big-countdown">23</div>
            </div>

            <img id="player-img" src="" class="player-img">
            <h2 id="player-name">Player Name</h2>
            <p id="player-details" style="color:#94a3b8;"></p>

            <div style="background:#0f172a; padding:10px; border-radius:8px; margin:10px 0;">
                <div>Current Bid: <strong id="current-bid-val" style="color:#eab308; font-size:1.5rem;">0.5 CR</strong></div>
                <div>Bidder: <span id="highest-bidder-name" style="color:var(--accent);">Base Price</span></div>
            </div>

            <!-- Single Team Personalized Bid Button -->
            <button id="main-bid-btn" class="bid-btn" onclick="placeBid()">BID FOR <span id="next-bid-val">0.5 CR</span></button>

            <!-- Admin Controls (Unlocked with Correct Password) -->
            <div id="admin-controls" style="display:none; grid-template-columns: 1fr 1fr; gap:5px; margin-top:15px;">
                <button onclick="sendAdmin('pause')" style="background:#475569; color:#fff;">PAUSE</button>
                <button onclick="sendAdmin('resume')" style="background:#475569; color:#fff;">RESUME</button>
                <button onclick="sendAdmin('undo')" style="background:#eab308; color:#000;">UNDO BID</button>
                <button onclick="downloadPDFRoster()" style="background:var(--accent); color:#000;">DOWNLOAD PDF</button>
            </div>
        </div>

        <!-- Live Audio/Chat Box -->
        <div class="chat-bar">
            <div id="chat-logs" style="max-height:80px; overflow-y:auto;"></div>
            <div style="display:flex; gap:5px; margin-top:5px;">
                <input type="text" id="chat-input" placeholder="Say something (e.g. Pause auction please)">
                <button onclick="sendChat()" style="width:70px;">Send</button>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: SOLD / UNSOLD OVERLAY -->
    <div id="result-overlay" class="overlay">
        <div class="box" style="width:90%;">
            <div id="result-stamp" class="stamp sold">SOLD</div>
            <img id="result-img" src="" style="width:130px; height:130px; border-radius:50%; object-fit:cover;">
            <h2 id="result-name"></h2>
            <p id="result-desc" style="font-size:1.2rem; margin-top:10px;"></p>
        </div>
    </div>

    <audio id="hammer-sound" src="https://actions.google.com/sounds/v1/impacts/wood_block_hit.ogg" preload="auto"></audio>

<script>
    const socket = io();
    let currentUser = "";
    let isSystemAdmin = false;
    let auctionState = {};
    let teamsList = [];
    let myPurse = 120.0;
    let mySquadCount = 0;
    let maxSquad = 17;
    let mabLimit = 0.5;
    const ADMIN_SECRET_PASS = "valle123";

    window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const preTeam = urlParams.get('team');
    const isParamAdmin = urlParams.get('admin') === 'true';
    
    if (preTeam) {
        setTimeout(() => {
            const select = document.getElementById("team-select");
            select.value = preTeam;
            checkFormEligibility();

            if (isParamAdmin) {
                // Admin ke liye: Checkbox tick kar do aur password box dikha do
                document.getElementById("admin-checkbox").checked = true;
                toggleAdminPassword();
            } else {
                // Normal Friend ke liye: Ek click me direct auction screen par bhej do
                enterAuction();
            }
        }, 600); // 0.6 second delay taaki sheet ka data load hokar dropdown ban jaye
    }
});
    
    socket.on("syncState", (data) => {
        auctionState = data.auctionState;
        teamsList = data.teams;
        
        // Populate Team Dropdown dynamically from Google Sheet 'Teams' tab
        const select = document.getElementById("team-select");
        select.innerHTML = '<option value="">-- Select Your Team --</option>';
        teamsList.forEach(team => {
            let tName = team['Team Name'] || team.Name || team.Team;
            if(tName) {
                select.innerHTML += `<option value="${tName}">${tName}</option>`;
            }
        });
        
        updateUI(auctionState);
    });

    function checkFormEligibility() {
        currentUser = document.getElementById("team-select").value;
        const btnEnter = document.getElementById("btn-enter-auction");
        const btnRet = document.getElementById("btn-retention-toggle");
        
        if (currentUser) {
            btnEnter.disabled = false;
            btnRet.style.display = "block";
        } else {
            btnEnter.disabled = true;
            btnRet.style.display = "none";
        }
    }

    function toggleAdminPassword() {
        const isChecked = document.getElementById("admin-checkbox").checked;
        document.getElementById("admin-password-box").style.display = isChecked ? "block" : "none";
    }

    function toggleRetentionBox() {
        const box = document.getElementById("retention-box");
        box.style.display = (box.style.display === "none") ? "block" : "none";
    }

    function applyRetention() {
        const price = parseFloat(document.getElementById("retention-price-input").value) || 15.0;
        myPurse -= price;
        mySquadCount += 1;
        alert(`Player Retained for ${price} CR! Remaining Purse: ${myPurse} CR`);
        document.getElementById("retention-box").style.display = "none";
    }

    function enterAuction() {
        currentUser = document.getElementById("team-select").value;
        const isAdminChecked = document.getElementById("admin-checkbox").checked;

        if (isAdminChecked) {
            let enteredPass = document.getElementById("admin-password-input").value;
            if (enteredPass !== ADMIN_SECRET_PASS) {
                alert("Incorrect Admin Password!");
                return;
            }
            isSystemAdmin = true;
        } else {
            isSystemAdmin = false;
        }

        document.getElementById("screen-login").classList.remove("active");
        document.getElementById("screen-dashboard").classList.add("active");

        if (isSystemAdmin) {
            document.getElementById("admin-controls").style.display = "grid";
            socket.emit("startAuction");
        }
    }

    socket.on("newPlayerDrawn", (data) => { updateUI(data.auctionState); });
    socket.on("bidUpdated", (data) => { updateUI(data.auctionState); });

    socket.on("timerTick", (data) => {
        const t = data.timer;
        document.getElementById("timer-text").textContent = t;
        const offset = 283 - (t / 23) * 283;
        document.getElementById("timer-arc").style.strokeDashoffset = offset;

        if (t <= 3 && t > 0) {
            speakVoice(`${t}`);
        }
    });

    socket.on("playerFinalized", (data) => {
        const overlay = document.getElementById("result-overlay");
        const stamp = document.getElementById("result-stamp");
        
        stamp.textContent = data.resultType;
        stamp.className = `stamp ${data.resultType.toLowerCase()}`;
        document.getElementById("result-img").src = data.player['Player Photo'] || 'https://via.placeholder.com/150';
        document.getElementById("result-name").textContent = data.player['Player Name'];

        if (data.resultType === "SOLD") {
            document.getElementById("result-desc").textContent = `Sold to ${data.team} for ${data.price.toFixed(1)} CR`;
            document.getElementById("hammer-sound").play().catch(()=>{});
            speakVoice(`${data.player['Player Name']} sold to ${data.team} for ${data.price.toFixed(1)} CR points`);
        } else {
            document.getElementById("result-desc").textContent = "Player Remains Unsold";
            speakVoice(`${data.player['Player Name']} remains unsold`);
        }

        overlay.classList.add("active");
        setTimeout(() => overlay.classList.remove("active"), 5000);
    });

    function updateUI(state) {
        auctionState = state;
        if (!state.currentPlayer) return;

        document.getElementById("player-img").src = state.currentPlayer['Player Photo'] || 'https://via.placeholder.com/180';
        document.getElementById("player-name").textContent = state.currentPlayer['Player Name'];
        document.getElementById("player-details").textContent = `Role: ${state.currentPlayer.Role} | Base Price: ${state.currentPlayer['Base Price']} CR`;
        
        document.getElementById("current-bid-val").textContent = `${state.currentBid.toFixed(1)} CR`;
        document.getElementById("highest-bidder-name").textContent = state.highestBidder;

        let inc = (state.currentBid < 1.0) ? 0.1 : (state.currentBid < 5.0 ? 0.2 : 0.5);
        let nextVal = (state.highestBidder === "None") ? state.currentBid : +(state.currentBid + inc).toFixed(1);
        document.getElementById("next-bid-val").textContent = `${nextVal.toFixed(1)} CR`;

        const bidBtn = document.getElementById("main-bid-btn");
        if (state.highestBidder === currentUser || mySquadCount >= maxSquad || (myPurse - nextVal) < mabLimit) {
            bidBtn.disabled = true;
        } else {
            bidBtn.disabled = false;
        }
    }

    function placeBid() {
        socket.emit("placeBid", { teamName: currentUser });
    }

    function sendAdmin(action) {
        socket.emit("adminAction", { action });
    }

    function speakVoice(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }
    }

    function sendChat() {
        const input = document.getElementById("chat-input");
        if (input.value.trim()) {
            socket.emit("sendChatMessage", { sender: currentUser, text: input.value.trim() });
            input.value = "";
        }
    }

    socket.on("receiveChatMessage", (data) => {
        const logs = document.getElementById("chat-logs");
        logs.innerHTML += `<div class="chat-msg"><strong>${data.sender}:</strong> ${data.text}</div>`;
        logs.scrollTop = logs.scrollHeight;
    });

    function downloadPDFRoster() {
        const element = document.getElementById("screen-dashboard");
        html2pdf().from(element).save("Cricket_Auction_Rosters.pdf");
    }
</script>
</body>
</html>
